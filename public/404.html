<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicPulse-BRICS — GitHub Pages Route Resolver</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      var repoBase = "/CivicPulse-BRICS/";
      
      if (path.includes("citizen")) {
        window.location.replace(repoBase + "static/citizen.html");
      } else if (path.includes("city")) {
        window.location.replace(repoBase + "static/city_official.html");
      } else if (path.includes("central")) {
        window.location.replace(repoBase + "static/central_official.html");
      } else if (path.includes("gov")) {
        window.location.replace(repoBase + "static/government.html");
      } else {
        window.location.replace(repoBase);
      }
    })();
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px; background:#0f172a; color:#f8fafc;">
  <h2>⚡ CivicPulse-BRICS Sovereign Gateway</h2>
  <p>Routing to portal... <a href="/CivicPulse-BRICS/" style="color:#60a5fa;">Click here to return to Gateway</a>.</p>
</body>
</html>
